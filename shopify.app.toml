# Configuration Shopify app.
name = "Livre des recettes & URSSAF"
client_id = "5e9776b61adcb708dbfc6cd1914adfdf"
application_url = "https://REMPLACER-PAR-URL-RENDER.onrender.com"
embedded = true

[build]
automatically_update_urls_on_dev = true

[access_scopes]
# Lecture seule : l'app ne modifie jamais les commandes.
scopes = "read_orders,read_all_orders"

[webhooks]
api_version = "2026-07"

  # Gérés par : /app/routes/webhooks.app.uninstalled.tsx
  [[webhooks.subscriptions]]
  topics = ["app/uninstalled"]
  uri = "/webhooks/app/uninstalled"

  # Gérés par : /app/routes/webhooks.app.scopes_update.tsx
  [[webhooks.subscriptions]]
  topics = ["app/scopes_update"]
  uri = "/webhooks/app/scopes_update"

  # Gérés par : /app/routes/webhooks.gdpr.tsx — obligatoires pour une app publique.
  [[webhooks.subscriptions]]
  compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
  uri = "/webhooks/gdpr"

[pos]
embedded = false
