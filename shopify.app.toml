# Configuration Shopify app.
name = "Livre des recettes & URSSAF"
client_id = "5e9776b61adcb708dbfc6cd1914adfdf"
application_url = "https://app-recettes-mpyr.onrender.com"
embedded = true

[auth]
redirect_urls = [ "https://app-recettes-mpyr.onrender.com/auth/callback" ]

[build]
automatically_update_urls_on_dev = true

[access_scopes]
# Lecture seule : l'app ne modifie jamais les commandes.
# read_all_orders retiré temporairement : scope protégé nécessitant une demande
# d'accès approuvée par Shopify avant de pouvoir être déclaré ici (section 4 de
# docs/phase-4-test-reel.md). À rajouter une fois la demande approuvée.
scopes = "read_orders"

[webhooks]
api_version = "2026-07"

  # Gérés par : /app/routes/webhooks.app.uninstalled.tsx
  [[webhooks.subscriptions]]
  topics = ["app/uninstalled"]
  uri = "/webhooks/app/uninstalled"

  # Gérés par : /app/routes/webhooks.app.scopes_update.tsx
  [[webhooks.subscriptions]]
  topics = ["app/scopes_update"]
  uri = "/webhooks/app/scopes_update"

  # Gérés par : /app/routes/webhooks.gdpr.tsx — obligatoires pour une app publique.
  [[webhooks.subscriptions]]
  compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
  uri = "/webhooks/gdpr"

[pos]
embedded = false
